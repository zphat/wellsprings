[package]
name = "wellsprings"
version = "0.2.0"
description = "Wellsprings: a digital grimoire for making music"
authors = ["Danny (9990 / mood.tech)"]
license = "MIT"
edition = "2021"

[lib]
name = "wellsprings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
