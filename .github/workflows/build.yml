name: Build

# Every push to main builds the Windows installer so you can grab a test build
# from the run's Artifacts. Tagging vX.Y.Z publishes a GitHub Release instead.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: npm install

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Wellsprings ${{ github.ref_name }}'
          releaseBody: |
            Download **Wellsprings_*_x64-setup.exe** below and run it. It installs for your user only (no admin needed).
            Windows SmartScreen may warn because the installer isn't code-signed yet: click "More info" then "Run anyway".
          releaseDraft: false
          prerelease: false

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: wellsprings-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
